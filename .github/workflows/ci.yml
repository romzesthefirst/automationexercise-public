name: Quick checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.suite }} / Java 17
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [api, ui-smoke, bdd-smoke]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Check Chrome
        if: matrix.suite != 'api'
        run: google-chrome --version
      - name: Verify CI runner
        run: python3 -m unittest discover -s tools -p test_run_ci.py
      - name: Run suite
        run: python3 tools/run_ci.py "${{ matrix.suite }}"
      - name: Upload results and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quick-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/ci/
          if-no-files-found: error
          retention-days: 14
