name: External-site regression

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.suite }} / Chrome / Java 17
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        suite: [ui, bdd]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Check Chrome
        run: google-chrome --version
      - name: Run suite
        run: python3 tools/run_ci.py "${{ matrix.suite }}" --threads 1
      - name: Upload results and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/ci/
          if-no-files-found: error
          retention-days: 14
